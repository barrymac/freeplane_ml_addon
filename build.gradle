buildscript {
    dependencies {
        classpath 'org.freeplane:gradle-freeplane-plugin:0.8'
    }
}

plugins {
    id 'groovy'
}

apply plugin: 'org.freeplane.gradle-freeplane-plugin'

def freeplaneVersion = "1.12.11"
def freeplaneBasePath = System.getenv('FREEPLANE_HOME') ?: "${System.getProperty('user.home')}/bin/freeplane-${freeplaneVersion}/"

repositories {
    mavenCentral()
}

dependencies {

//    implementation(
//            'org.apache.groovy:groovy:4.0.21',
//            'org.apache.groovy:groovy-templates:4.0.21',
//            'org.apache.groovy:groovy-json:4.0.21',
//            'org.apache.groovy:groovy-swing:4.0.21',
//    )

    testImplementation(
            platform('org.junit:junit-bom:5.14.4'),
            platform("org.spockframework:spock-bom:2.5-groovy-4.0"),
            "org.hamcrest:hamcrest-core:2.2",
            'org.freeplane:gradle-freeplane-plugin:0.8',
            "org.spockframework:spock-core:2.5-groovy-4.0"
    )

    testRuntimeOnly(
            'org.junit.jupiter:junit-jupiter-engine',
            'org.junit.platform:junit-platform-launcher',
            'net.bytebuddy:byte-buddy:1.14.12',
            "org.objenesis:objenesis:3.4",
    )

    // Freeplane's own Markdown renderer; used for previews and note tooltips.
    // The jar is supplied by the installed Freeplane Markdown plugin, not
    // bundled into the add-on.
    compileOnly fileTree("${freeplaneBasePath}/plugins/org.freeplane.plugin.markdown/lib") {
        include '*.jar'
    }
    testImplementation fileTree("${freeplaneBasePath}/plugins/org.freeplane.plugin.markdown/lib") {
        include '*.jar'
    }
}

sourceSets {
    main {
        groovy {
            srcDirs 'src/main/groovy'
//            ,'src/add-on/scripts'
        }
        resources {
            srcDirs 'src/main/resources'
            includes = ['**/*.png', '**/*.txt', '**/*.json'] // Include PNG, TXT, and JSON files
        }
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

freeplane {
    freeplaneDirectory = freeplaneBasePath
    // Freeplane user settings root WITHOUT the version suffix —
    // packageAddon needs it to find installed add-ons (devtools).
    userDirectory = System.getenv('FREEPLANE_USER_DIR') ?: "${System.getProperty('user.home')}/.config/freeplane"
    addonSourceDirectory = 'src/add-on'
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

jar {
    archiveFileName = 'llm.jar'
    from sourceSets.main.resources
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Freeplane compiles add-on scripts only when a user invokes them, so a
// packaging-only build can ship scripts that fail at runtime. Compile every
// script against the real Freeplane installation before test/package runs.
tasks.register('compileAddonScripts', JavaExec) {
    dependsOn jar
    classpath = files(
            fileTree(freeplaneBasePath) { include '**/*.jar' },
            tasks.jar.outputs.files
    )
    mainClass = 'org.codehaus.groovy.tools.FileSystemCompiler'
    def outputDirectory = layout.buildDirectory.dir('addonScriptClasses').get().asFile
    args(['-d', outputDirectory.absolutePath] +
            fileTree('src/add-on/scripts') { include '*.groovy' }.files)
}

tasks.named('check') {
    dependsOn 'compileAddonScripts'
}

afterEvaluate {
    tasks.named('packageAddon') {
        dependsOn 'compileAddonScripts'
    }
}
